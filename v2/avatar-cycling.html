<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar v2 — Cycling</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    .avatar {
      width: 400px;
      height: 400px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      background: transparent;
      isolation: isolate;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    /* Clothing */
    .jersey {
      position: absolute;
      width: 280px;
      height: 130px;
      left: 60px;
      top: 300px;
      background: #1b2a4a;
      border-radius: 45% 45% 0 0 / 30% 30% 0 0;
      z-index: 1;
    }
    .jersey::before {
      content: '';
      position: absolute;
      width: 80px;
      height: 50px;
      left: 100px;
      top: 0;
      background: #243b6b;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
    }
    .zipper {
      position: absolute;
      width: 4px;
      height: 70px;
      left: 138px;
      top: 35px;
      background: #8c9bb3;
      z-index: 2;
    }

    /* Neck */
    .neck {
      position: absolute;
      width: 64px;
      height: 70px;
      left: 168px;
      top: 255px;
      background: #d6b894;
      border-radius: 0 0 40% 40%;
      z-index: 2;
    }
    .neck::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.06);
      border-radius: 0 0 40% 40%;
    }

    /* Ears */
    .ear {
      position: absolute;
      width: 34px;
      height: 58px;
      top: 132px;
      background: #eacfb1;
      z-index: 3;
    }
    .ear.left {
      left: 88px;
      border-radius: 40% 60% 30% 70% / 30% 60% 40% 70%;
    }
    .ear.right {
      right: 88px;
      border-radius: 60% 40% 70% 30% / 60% 30% 70% 40%;
    }
    .ear::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      top: 15%;
      left: 20%;
      background: #dcb898;
      border-radius: inherit;
    }

    /* Head */
    .head {
      position: absolute;
      width: 180px;
      height: 225px;
      left: 110px;
      top: 75px;
      background: #eacfb1;
      border-radius: 45% 45% 55% 55% / 48% 48% 58% 58%;
      z-index: 4;
      overflow: hidden;
    }

    /* Beard / stubble */
    .beard {
      position: absolute;
      width: 100%;
      height: 90px;
      bottom: 0;
      left: 0;
      background: #8a6b57;
      border-radius: 0 0 50% 50% / 0 0 35% 35%;
      z-index: 4;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      width: 72px;
      height: 36px;
      left: 54px;
      top: 158px;
      background: #eacfb1;
      border-radius: 0 0 50% 50%;
      z-index: 5;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      width: 90%;
      height: 12px;
      top: 0;
      left: 5%;
      background: #fff;
      border-radius: 0 0 12px 12px;
    }
    .mouth::after {
      content: '';
      position: absolute;
      width: 80%;
      height: 20px;
      bottom: 0;
      left: 10%;
      background: #c75a63;
      border-radius: 0 0 30px 30px;
    }

    /* Nose */
    .nose {
      position: absolute;
      width: 30px;
      height: 16px;
      left: 75px;
      top: 132px;
      background: #dcb898;
      border-radius: 0 0 30px 30px;
      z-index: 5;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
    }

    /* Sunglasses */
    .sunglasses {
      position: absolute;
      width: 188px;
      height: 50px;
      left: 106px;
      top: 145px;
      z-index: 15;
    }
    .lens {
      position: absolute;
      width: 86px;
      height: 42px;
      top: 4px;
      background: linear-gradient(160deg, #574766 0%, #1f1422 100%);
      border: 3px solid #111;
      border-radius: 8px 8px 40px 40px;
    }
    .lens.left { left: 0; }
    .lens.right { right: 0; }
    .bridge {
      position: absolute;
      width: 24px;
      height: 8px;
      left: 82px;
      top: 10px;
      background: #111;
      border-radius: 4px;
    }

    /* Helmet */
    .helmet-shell {
      position: absolute;
      width: 230px;
      height: 105px;
      left: 85px;
      top: 38px;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      border-radius: 50% 50% 15% 15% / 70% 70% 30% 30%;
      z-index: 20;
      box-shadow: inset 0 -8px 16px rgba(0,0,0,0.08);
    }
    .helmet-rim {
      position: absolute;
      width: 234px;
      height: 18px;
      left: 83px;
      top: 135px;
      background: #e8e8e8;
      border-radius: 50%;
      z-index: 21;
      box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    }
    .vent {
      position: absolute;
      width: 42px;
      height: 14px;
      background: #1a1a1a;
      border-radius: 7px;
      z-index: 22;
    }
    .vent.v1 { left: 120px; top: 58px; transform: rotate(-18deg); }
    .vent.v2 { left: 179px; top: 48px; }
    .vent.v3 { right: 120px; top: 58px; transform: rotate(18deg); }
    .strap {
      position: absolute;
      width: 6px;
      height: 150px;
      background: #2c2c2c;
      top: 150px;
      z-index: 18;
    }
    .strap.left { left: 115px; transform: rotate(8deg); transform-origin: top center; }
    .strap.right { right: 115px; transform: rotate(-8deg); transform-origin: top center; }
    .buckle {
      position: absolute;
      width: 18px;
      height: 14px;
      left: 191px;
      top: 285px;
      background: #444;
      border-radius: 3px;
      z-index: 19;
    }
  </style>
</head>
<body>
  <div class="avatar">
    <div class="jersey">
      <div class="zipper"></div>
    </div>
    <div class="neck"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="beard"></div>
      <div class="mouth"></div>
      <div class="nose"></div>
    </div>
    <div class="sunglasses">
      <div class="lens left"></div>
      <div class="bridge"></div>
      <div class="lens right"></div>
    </div>
    <div class="helmet-shell"></div>
    <div class="helmet-rim"></div>
    <div class="vent v1"></div>
    <div class="vent v2"></div>
    <div class="vent v3"></div>
    <div class="strap left"></div>
    <div class="strap right"></div>
    <div class="buckle"></div>
  </div>
</body>
</html>
