<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar v2 — Hobbiton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    .avatar {
      width: 400px;
      height: 400px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      background: transparent;
      isolation: isolate;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    /* Clothing */
    .shirt {
      position: absolute;
      width: 270px;
      height: 125px;
      left: 65px;
      top: 305px;
      background: #232831;
      border-radius: 45% 45% 0 0 / 30% 30% 0 0;
      z-index: 1;
    }
    .shirt::before {
      content: '';
      position: absolute;
      width: 70px;
      height: 50px;
      left: 100px;
      top: 0;
      background: #2f3742;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
    }

    /* Neck */
    .neck {
      position: absolute;
      width: 64px;
      height: 70px;
      left: 168px;
      top: 255px;
      background: #d6b894;
      border-radius: 0 0 40% 40%;
      z-index: 2;
    }
    .neck::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.06);
      border-radius: 0 0 40% 40%;
    }

    /* Ears */
    .ear {
      position: absolute;
      width: 34px;
      height: 58px;
      top: 132px;
      background: #eacfb1;
      z-index: 3;
    }
    .ear.left {
      left: 88px;
      border-radius: 40% 60% 30% 70% / 30% 60% 40% 70%;
    }
    .ear.right {
      right: 88px;
      border-radius: 60% 40% 70% 30% / 60% 30% 70% 40%;
    }
    .ear::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      top: 15%;
      left: 20%;
      background: #dcb898;
      border-radius: inherit;
    }

    /* Head */
    .head {
      position: absolute;
      width: 180px;
      height: 225px;
      left: 110px;
      top: 75px;
      background: #eacfb1;
      border-radius: 45% 45% 55% 55% / 48% 48% 58% 58%;
      z-index: 4;
      overflow: hidden;
    }

    /* Beard / stubble */
    .beard {
      position: absolute;
      width: 100%;
      height: 85px;
      bottom: 0;
      left: 0;
      background: #8a6b57;
      border-radius: 0 0 50% 50% / 0 0 35% 35%;
      z-index: 4;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      width: 72px;
      height: 36px;
      left: 54px;
      top: 158px;
      background: #eacfb1;
      border-radius: 0 0 50% 50%;
      z-index: 5;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      width: 90%;
      height: 12px;
      top: 0;
      left: 5%;
      background: #fff;
      border-radius: 0 0 12px 12px;
    }
    .mouth::after {
      content: '';
      position: absolute;
      width: 80%;
      height: 20px;
      bottom: 0;
      left: 10%;
      background: #c75a63;
      border-radius: 0 0 30px 30px;
    }

    /* Nose */
    .nose {
      position: absolute;
      width: 30px;
      height: 16px;
      left: 75px;
      top: 132px;
      background: #dcb898;
      border-radius: 0 0 30px 30px;
      z-index: 5;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
    }

    /* Sunglasses */
    .sunglasses {
      position: absolute;
      width: 170px;
      height: 56px;
      left: 115px;
      top: 150px;
      z-index: 15;
    }
    .lens {
      position: absolute;
      width: 72px;
      height: 56px;
      top: 0;
      background: linear-gradient(160deg, #4a3f4d 0%, #1a1420 100%);
      border: 3px solid #2c2c2c;
      border-radius: 50% 50% 45% 45%;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.1);
    }
    .lens.left { left: 0; }
    .lens.right { right: 0; }
    .bridge {
      position: absolute;
      width: 22px;
      height: 6px;
      left: 74px;
      top: 18px;
      background: #2c2c2c;
      border-radius: 3px;
    }

    /* Cap */
    .cap-dome {
      position: absolute;
      width: 188px;
      height: 92px;
      left: 106px;
      top: 50px;
      background: #2c2c2c;
      border-radius: 50% 50% 0 0 / 80% 80% 0 0;
      z-index: 20;
    }
    .cap-dome::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 87px;
      top: -4px;
      background: #1f1f1f;
      border-radius: 50%;
    }
    .cap-brim {
      position: absolute;
      width: 204px;
      height: 42px;
      left: 98px;
      top: 120px;
      background: #2c2c2c;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      z-index: 21;
      box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
  <div class="avatar">
    <div class="shirt"></div>
    <div class="neck"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="beard"></div>
      <div class="mouth"></div>
      <div class="nose"></div>
    </div>
    <div class="sunglasses">
      <div class="lens left"></div>
      <div class="bridge"></div>
      <div class="lens right"></div>
    </div>
    <div class="cap-dome"></div>
    <div class="cap-brim"></div>
  </div>
</body>
</html>
