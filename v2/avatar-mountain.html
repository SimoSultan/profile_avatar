<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar v2 — Mountain</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    .avatar {
      width: 400px;
      height: 400px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      background: transparent;
      isolation: isolate;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    /* Clothing */
    .hoodie {
      position: absolute;
      width: 290px;
      height: 140px;
      left: 55px;
      top: 290px;
      background: #2d2d2d;
      border-radius: 45% 45% 0 0 / 28% 28% 0 0;
      z-index: 1;
    }
    .hoodie::before {
      content: '';
      position: absolute;
      width: 90px;
      height: 60px;
      left: 100px;
      top: 0;
      background: #3a3a3a;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
    }
    .hoodie-cord {
      position: absolute;
      width: 4px;
      height: 60px;
      background: #555;
      top: 40px;
      border-radius: 2px;
      z-index: 3;
    }
    .hoodie-cord.left { left: 130px; transform: rotate(8deg); }
    .hoodie-cord.right { right: 130px; transform: rotate(-8deg); }

    /* Neck */
    .neck {
      position: absolute;
      width: 64px;
      height: 70px;
      left: 168px;
      top: 255px;
      background: #d6b894;
      border-radius: 0 0 40% 40%;
      z-index: 2;
    }
    .neck::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.06);
      border-radius: 0 0 40% 40%;
    }

    /* Ears */
    .ear {
      position: absolute;
      width: 34px;
      height: 58px;
      top: 132px;
      background: #eacfb1;
      z-index: 3;
    }
    .ear.left {
      left: 88px;
      border-radius: 40% 60% 30% 70% / 30% 60% 40% 70%;
    }
    .ear.right {
      right: 88px;
      border-radius: 60% 40% 70% 30% / 60% 30% 70% 40%;
    }
    .ear::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      top: 15%;
      left: 20%;
      background: #dcb898;
      border-radius: inherit;
    }

    /* Head */
    .head {
      position: absolute;
      width: 180px;
      height: 225px;
      left: 110px;
      top: 75px;
      background: #eacfb1;
      border-radius: 45% 45% 55% 55% / 48% 48% 58% 58%;
      z-index: 4;
      overflow: hidden;
    }

    /* Hair */
    .hair {
      position: absolute;
      width: 190px;
      height: 95px;
      left: 105px;
      top: 42px;
      background: #6b4c3d;
      border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
      z-index: 16;
    }
    .hair::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 40px;
      bottom: -10px;
      background: linear-gradient(180deg, transparent 0%, #6b4c3d 100%);
    }
    .spike {
      position: absolute;
      background: #6b4c3d;
      border-radius: 50% 50% 0 0;
    }
    .spike.s1 { width: 30px; height: 45px; left: 20px; top: -18px; transform: rotate(-25deg); }
    .spike.s2 { width: 28px; height: 55px; left: 55px; top: -28px; transform: rotate(-10deg); }
    .spike.s3 { width: 34px; height: 60px; left: 88px; top: -32px; }
    .spike.s4 { width: 30px; height: 52px; right: 55px; top: -24px; transform: rotate(10deg); }
    .spike.s5 { width: 28px; height: 42px; right: 20px; top: -16px; transform: rotate(25deg); }

    /* Beard / stubble */
    .beard {
      position: absolute;
      width: 100%;
      height: 88px;
      bottom: 0;
      left: 0;
      background: #8a6b57;
      border-radius: 0 0 50% 50% / 0 0 35% 35%;
      z-index: 4;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      width: 72px;
      height: 36px;
      left: 54px;
      top: 158px;
      background: #eacfb1;
      border-radius: 0 0 50% 50%;
      z-index: 5;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      width: 90%;
      height: 12px;
      top: 0;
      left: 5%;
      background: #fff;
      border-radius: 0 0 12px 12px;
    }
    .mouth::after {
      content: '';
      position: absolute;
      width: 80%;
      height: 20px;
      bottom: 0;
      left: 10%;
      background: #c75a63;
      border-radius: 0 0 30px 30px;
    }

    /* Nose */
    .nose {
      position: absolute;
      width: 30px;
      height: 16px;
      left: 75px;
      top: 132px;
      background: #dcb898;
      border-radius: 0 0 30px 30px;
      z-index: 5;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
    }

    /* Sunglasses */
    .sunglasses {
      position: absolute;
      width: 170px;
      height: 56px;
      left: 115px;
      top: 150px;
      z-index: 17;
    }
    .lens {
      position: absolute;
      width: 72px;
      height: 56px;
      top: 0;
      background: linear-gradient(160deg, #4a3f4d 0%, #1a1420 100%);
      border: 3px solid #3a3a3a;
      border-radius: 50% 50% 45% 45%;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.1);
    }
    .lens.left { left: 0; }
    .lens.right { right: 0; }
    .bridge {
      position: absolute;
      width: 22px;
      height: 6px;
      left: 74px;
      top: 18px;
      background: #3a3a3a;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="avatar">
    <div class="hoodie">
      <div class="hoodie-cord left"></div>
      <div class="hoodie-cord right"></div>
    </div>
    <div class="neck"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="beard"></div>
      <div class="mouth"></div>
      <div class="nose"></div>
    </div>
    <div class="hair">
      <div class="spike s1"></div>
      <div class="spike s2"></div>
      <div class="spike s3"></div>
      <div class="spike s4"></div>
      <div class="spike s5"></div>
    </div>
    <div class="sunglasses">
      <div class="lens left"></div>
      <div class="bridge"></div>
      <div class="lens right"></div>
    </div>
  </div>
</body>
</html>
